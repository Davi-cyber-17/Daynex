<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daynex</title>
<link rel="icon" type="image/png" href="logo.png">
<script>try{var t=localStorage.getItem('cd_tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <header class="topo">
    <button class="tema" id="tema" type="button">Modo claro</button>
    <img class="marca" id="marca" alt="Daynex" src="logo.png">
    <div class="nome-site">DAY<i>NEX</i></div>
    <div class="slogan">THE FUTURE, <b>IN DAYS.</b></div>
  </header>

  <div class="tabs">
    <button class="tab on" data-aba="contagem" type="button">Contagem</button>
    <button class="tab" data-aba="calc" type="button">Calculadora</button>
    <button class="tab" data-aba="natal" type="button">Natal</button>
  </div>

  <section id="aba-contagem">
    <div class="card">
      <h2>Qual é a data?</h2>
      <div class="grid">
        <div class="full"><label for="nome">Nome do evento (opcional)</label><input id="nome" maxlength="40" placeholder="Ex.: Viagem, aniversário, prova…"></div>
        <div class="full"><label for="data">Data</label><input type="date" id="data" min="0001-01-01" max="9999-12-31"></div>
                <button class="btn" id="calcular" type="button">Calcular</button>
        <button class="btn sec" id="salvar-direto" type="button">Salvar data</button>
        <div class="nota full" id="msg" style="text-align:center" aria-live="polite"></div>
      </div>
    </div>

    <div class="card hero pop oculto" id="hero">
      <div class="nome" id="h-nome"></div>
      <div class="big" id="h-num">0</div>
      <div class="leg" id="h-leg"></div>
      <div class="data" id="h-data"></div>
      <div class="rel">
        <div><b id="r-d">0</b><small>dias</small></div>
        <div><b id="r-h">0</b><small>horas</small></div>
        <div><b id="r-m">0</b><small>min</small></div>
        <div><b id="r-s">0</b><small>seg</small></div>
      </div>
      <div class="nota" id="h-nota">Contagem exata até 00h do dia escolhido</div>
      <div id="h-prog" class="oculto">
        <div class="barra"><i id="h-bar"></i></div>
        <div class="nota" id="h-pct"></div>
      </div>
      <div class="acoes">
        <button class="btn" id="salvar" type="button">Salvar evento</button>
        <button class="btn sec" id="copiar" type="button">Copiar</button>
      </div>
    </div>

    <div class="card">
      <h2>Meus eventos</h2>
      <div class="lista" id="lista"></div>
    </div>
  </section>

  <section id="aba-calc" class="oculto">
    <div class="card">
      <h2>Entre duas datas</h2>
      <div class="grid">
        <div><label for="c-ini">De</label><input type="date" id="c-ini"></div>
        <div><label for="c-fim">Até</label><input type="date" id="c-fim"></div>
        <button class="btn full" id="c-go" type="button">Calcular intervalo</button>
      </div>
      <div class="res" id="c-res"></div>
    </div>
    <div class="card">
      <h2>Somar ou subtrair dias</h2>
      <div class="grid">
        <div><label for="s-base">Data inicial</label><input type="date" id="s-base"></div>
        <div><label for="s-dias">Dias (use − para voltar)</label><input type="number" id="s-dias" value="30" step="1"></div>
        <button class="btn full" id="s-go" type="button">Descobrir a data</button>
      </div>
      <div class="res" id="s-res"></div>
    </div>
  </section>

  <section id="aba-natal" class="oculto">
    <div class="neve" aria-hidden="true"></div>
    <svg class="luzes" viewBox="0 0 400 34" aria-hidden="true"><path d="M0 6 Q40 36 80 8 Q120 36 160 8 Q200 36 240 8 Q280 36 320 8 Q360 36 400 8"/><circle cx="20" cy="17.5" r="4.2"/><circle cx="40" cy="21.5" r="4.2"/><circle cx="60" cy="18.5" r="4.2"/><circle cx="100" cy="17.5" r="4.2"/><circle cx="120" cy="21.5" r="4.2"/><circle cx="140" cy="18.5" r="4.2"/><circle cx="180" cy="17.5" r="4.2"/><circle cx="200" cy="21.5" r="4.2"/><circle cx="220" cy="18.5" r="4.2"/><circle cx="260" cy="17.5" r="4.2"/><circle cx="280" cy="21.5" r="4.2"/><circle cx="300" cy="18.5" r="4.2"/><circle cx="340" cy="17.5" r="4.2"/><circle cx="360" cy="21.5" r="4.2"/><circle cx="380" cy="18.5" r="4.2"/></svg>
    <div class="card hero">
      <svg class="arvore" viewBox="0 0 120 130" aria-hidden="true"><polygon points="60,2 63,10 72,10 65,15 68,24 60,19 52,24 55,15 48,10 57,10" fill="#ffd60a"/><polygon points="60,14 88,52 32,52" fill="#15803d"/><polygon points="60,34 98,80 22,80" fill="#16a34a"/><polygon points="60,58 108,112 12,112" fill="#22c55e"/><rect x="53" y="112" width="14" height="14" fill="#7c4a1e"/><circle cx="60" cy="44" r="3" fill="#ff3b3b"/><circle cx="48" cy="68" r="3.5" fill="#ffd60a"/><circle cx="74" cy="72" r="3.5" fill="#ff3b3b"/><circle cx="36" cy="100" r="4" fill="#ffd60a"/><circle cx="60" cy="92" r="4" fill="#4da3ff"/><circle cx="84" cy="102" r="4" fill="#ff3b3b"/></svg>
      <div class="nome">Contagem para o Natal</div>
      <div class="big" id="n-num">0</div>
      <div class="leg" id="n-leg"></div>
      <div class="data" id="n-data"></div>
      <div class="rel">
        <div><b id="n-d">0</b><small>dias</small></div>
        <div><b id="n-h">0</b><small>horas</small></div>
        <div><b id="n-m">0</b><small>min</small></div>
        <div><b id="n-s">0</b><small>seg</small></div>
      </div>
      <div class="nota">Contagem exata até 00h do dia 25 de dezembro</div>
      <div class="barra"><i id="n-bar"></i></div>
      <div class="nota" id="n-pct"></div>
    </div>
    <div class="card">
      <h2>Até o Natal em números</h2>
      <div class="stats" id="n-stats"></div>
    </div>
  </section>
</div>

<script src="script.js"></script>
</body>
</html>
